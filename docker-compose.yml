version: '3.8'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bibliotheque_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - bibliotheque_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: bibliotheque_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - bibliotheque_network
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    container_name: bibliotheque_db
    restart: unless-stopped
    environment:
     POSTGRES_DB: laravel
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bibliotheque_network

networks:
  bibliotheque_network:
    driver: bridge

volumes:
  postgres_data:
